name: Monitor official ASAJ publications
on:
  workflow_dispatch:
  schedule:
    # 06:00 Jamaica time (UTC-5 year-round)
    - cron: '0 11 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (never the review branch)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion dependencies
        run: pip install -r requirements-ingest.txt
      - name: Check official ASAJ sources and stage review candidates
        run: python scripts/ingest_asaj.py
      - name: Verify both review outputs exist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('review/asaj')
          for name in ('index.json', 'proposals.json'):
              path = base / name
              assert path.is_file(), f'Missing required output: {path}'
              data = json.loads(path.read_text(encoding='utf-8'))
              print(f'{path}: {path.stat().st_size} bytes')
              if name == 'proposals.json':
                  assert data.get('status') == 'UNVERIFIED_REVIEW_ONLY'
                  assert isinstance(data.get('candidates'), list)
                  print(f"Candidate records: {len(data['candidates'])} (zero is valid)")
          PY
      - name: Upload review outputs on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asaj-review-outputs-${{ github.run_number }}
          path: |
            review/asaj/index.json
            review/asaj/proposals.json
          if-no-files-found: warn
          retention-days: 30
      - name: Open review-only pull request when files change
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/asaj-document-review
          delete-branch: true
          title: 'Review: official ASAJ publication changes'
          commit-message: 'Stage official ASAJ publication metadata and unverified candidates'
          body: |
            Review `review/asaj/index.json` and `review/asaj/proposals.json` against the linked official ASAJ PDFs.
            These candidates are UNVERIFIED and are not approved swimming performances.
            This PR does NOT change live CSVs or website values.
            Swimmer identity: Aidan Seaton, independent of affiliation.
          add-paths: |
            review/asaj/index.json
            review/asaj/proposals.json
